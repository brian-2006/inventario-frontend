server {
    # Escuchar en el puerto 5173 dentro del contenedor
    listen 5173;
    # El nombre del servidor, no es crítico para este caso
    server_name localhost;

    # Directorio raíz donde se encuentran los archivos estáticos de React
    root /usr/share/nginx/html;
    # El archivo por defecto a servir, usualmente index.html
    index index.html;

    # Esta sección es importante para que el enrutamiento de React (React Router) funcione.
    # Si Nginx no encuentra un archivo en la ruta solicitada,
    # simplemente devolverá el index.html. React se encargará del resto.
    location / {
        try_files $uri /index.html;
    }
}
